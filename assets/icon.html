<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #E3EAE0; }
  body { display: grid; place-items: center; }
  /* 12% safe padding each side → mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- the bare racetrack ring with the crimson tick dot at one corner -->
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="4" y="7" width="24" height="18" rx="9"
          fill="none" stroke="#16171A" stroke-width="3"/>
    <circle cx="25" cy="9.5" r="4.2" fill="#C42847"/>
  </svg>
</body>
</html>
